name: Build AIO-UDP Gateway

on:
  push:
    branches:
      - main # Sesuaikan dengan branch kamu

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout repository agar Dockerfile tersedia di context '.'
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login ke GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      # =======================================================
      # Build & Push (Label 1 baris lurus dengan pembatas |)
      # =======================================================
      # 3. Build and Push dengan custom tag
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tentukan nama image dan tag di sini
          tags: ghcr.io/${{ github.repository_owner }}/cfudp:001
